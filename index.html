<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- IMPEDISCE AD IPHONE DI TRASFORMARE I NUMERI IN LINK BLU -->
    <meta name="format-detection" content="telephone=no">
    <title>Massimo Ciotola - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ----------------------------------------------------
           FULLSCREEN & SFONDO
        ---------------------------------------------------- */
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
           SCHERMATA INTRO LOGO (2.8 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1.2s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(12px);
            }
            30% {
                opacity: 1;
                filter: blur(0px);
            }
            70% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.05);
                filter: blur(10px);
            }
        }

        /* ----------------------------------------------------
           BIGLIETTO DA VISITA DIGITALE
        ---------------------------------------------------- */
        .card {
            width: 90%;
            max-width: 380px;
            height: 85vh;
            height: 85dvh;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* NOME E COGNOME */
        .name-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 180px;
            height: 4px;
            background-color: #e60000;
            margin: 25px 0 35px 0;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: left;
            box-shadow: 0 0 10px rgba(230, 0, 0, 0.4);
        }

        /* SEZIONE CONTATTI */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: inline-block;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            transition: color 0.3s, transform 0.2s;
            word-break: break-all;
        }

        .contact-link:active {
            color: #e60000;
            transform: scale(0.98);
        }

        /* SEZIONE AZIENDA FOOTER */
        .company-info {
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ffffff;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            user-select: none;
        }

        .company-name {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #ffffff;
        }

        /* FORZATURA BIANCO E RIMOZIONE EVENTUALI LINK IPHONE SULLA P.IVA */
        .piva-text, .piva-text a {
            color: #ffffff !important;
            text-decoration: none !important;
            pointer-events: none !important; /* Blocca il tocco/click su iPhone */
            font-weight: 500;
            display: block;
            margin-top: 2px;
        }

        /* ----------------------------------------------------
           ANIMAZIONI MOLTO PIÙ LENTE (3.5 SECONDI)
        ---------------------------------------------------- */
        .animate-in {
            animation: fadeInVerySlow 3.5s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .animate-line {
            animation: expandLineVerySlow 3.5s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        @keyframes fadeInVerySlow {
            0% {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes expandLineVerySlow {
            0% {
                opacity: 0;
                transform: scaleX(0);
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* RITARDI DILAZIONATI: Il nome appare dopo che lo sfondo si è rivelato */
        .delay-1 { animation-delay: 4.2s; } /* Nome (apparizione successiva allo sfondo) */
        .delay-2 { animation-delay: 5.0s; } /* Linea Rossa */
        .delay-3 { animation-delay: 5.8s; } /* Email */
        .delay-4 { animation-delay: 6.6s; } /* Telefono */
        .delay-5 { animation-delay: 7.4s; } /* Azienda & P.IVA */
    </style>
</head>

<body>

    <!-- 1. INTRO LOGO -->
    <div id="loader">
        <img src="logo intro.png" alt="Logo" class="intro-logo-img">
    </div>

    <!-- 2. CARD DIGITALE -->
    <div class="card">
        <div>
            <!-- Nome e Cognome -->
            <div class="name-title animate-in delay-1">
                MASSIMO<br>CIOTOLA
            </div>

            <!-- Linea Rossa MAN -->
            <div class="red-line animate-line delay-2"></div>

            <!-- Contatti Cliccabili -->
            <div class="contact-info">
                <!-- Email -->
                <a href="mailto:massimo.impromart@gmail.com" class="contact-link animate-in delay-3">
                    massimo.impromart@gmail.com
                </a>

                <!-- Telefono -->
                <a href="#" onclick="handlePhoneClick(event)" class="contact-link animate-in delay-4">
                    +39 334 604 4926
                </a>
            </div>
        </div>

        <!-- Dati Aziendali -->
        <div class="company-info animate-in delay-5">
            <div class="company-name">Impromart SRL</div>
            Traversa Fossitelli snc<br>
            80147 - Napoli<br>
            <span class="piva-text">04911050633</span>
        </div>
    </div>

    <script>
        // Gestione chiusura intro
        setTimeout(() => {
            const loader = document.getElementById("loader");
            if (loader) {
                loader.classList.add("hidden");
                setTimeout(() => loader.style.display = 'none', 1200);
            }
        }, 2800);

        // Attivazione automatica Schermo Intero al primo tocco dell'utente
        function requestFullScreen() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) {
                doc.requestFullscreen().catch(() => {});
            } else if (doc.webkitRequestFullscreen) {
                doc.webkitRequestFullscreen();
            } else if (doc.msRequestFullscreen) {
                doc.msRequestFullscreen();
            }
        }
        document.addEventListener('click', requestFullScreen, { once: true });
        document.addEventListener('touchstart', requestFullScreen, { once: true });

        // Gestione Click Telefono: Scarica vCard e chiama
        function handlePhoneClick(e) {
            e.preventDefault();
            
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Ciotola;Massimo;;;
FN:Massimo Ciotola
ORG:Impromart SRL
TITLE:Venditore Camion & Veicoli Industriali
TEL;TYPE=CELL:+393346044926
EMAIL;TYPE=WORK:massimo.impromart@gmail.com
ADR;TYPE=WORK:;;Traversa Fossitelli snc;Napoli;;80147;Italy
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', 'Massimo_Ciotola_MAN.vcf');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                window.location.href = "tel:+393346044926";
            }, 300);
        }
    </script>
</body>
</html>
