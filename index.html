<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- FORZA BARRE BROWSER NERE E SCURE SU IPHONE E ANDROID -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>Massimo Ciotola - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000; /* Assicura che le barre del browser su iPhone/Safari siano NERE */
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
           1. SCHERMATA INTRO LOGO (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(12px);
            }
            30% {
                opacity: 1;
                filter: blur(0px);
            }
            70% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.05);
                filter: blur(10px);
            }
        }

        /* ----------------------------------------------------
           2. BIGLIETTO DA VISITA DIGITALE
        ---------------------------------------------------- */
        .card {
            width: 90%;
            max-width: 380px;
            height: 85vh;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInCard 1.2s ease forwards 2.8s;
        }

        @keyframes fadeInCard {
            to { opacity: 1; }
        }

        /* NOME E COGNOME */
        .name-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 180px;
            height: 4px;
            background-color: #e60000;
            margin: 25px 0 35px 0;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: left;
            box-shadow: 0 0 10px rgba(230, 0, 0, 0.4);
        }

        /* CONTATTI */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: inline-block;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            transition: color 0.3s, transform 0.2s;
            word-break: break-all;
        }

        .contact-link:active {
            color: #e60000;
            transform: scale(0.98);
        }

        /* AZIENDA & PARTITA IVA */
        .company-info {
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ffffff;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            user-select: none;
        }

        .company-name {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .piva-text {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            text-decoration: none !important;
            font-weight: 500;
            display: block;
            margin-top: 2px;
        }

        /* ----------------------------------------------------
           ANIMAZIONI LENTE
        ---------------------------------------------------- */
        .animate-in {
            animation: fadeInVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .animate-line {
            animation: expandLineVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        @keyframes fadeInVerySlow {
            0% {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes expandLineVerySlow {
            0% {
                opacity: 0;
                transform: scaleX(0);
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* TEMPI DI APPARIZIONE */
        .delay-1 { animation-delay: 3.8s; } /* Nome (compare dopo lo sfondo) */
        .delay-2 { animation-delay: 4.5s; } /* Linea Rossa */
        .delay-3 { animation-delay: 5.2s; } /* Email */
        .delay-4 { animation-delay: 5.9s; } /* Telefono */
        .delay-5 { animation-delay: 6.6s; } /* Azienda e P.IVA */
    </style>
</head>

<body>

    <!-- INTRO LOGO -->
    <div id="loader">
        <img src="logo intro.png" alt="Logo" class="intro-logo-img">
    </div>

    <!-- CARD DIGITALE -->
    <div class="card">
        <div>
            <!-- Nome e Cognome -->
            <div class="name-title animate-in delay-1">
                MASSIMO<br>CIOTOLA
            </div>

            <!-- Linea Rossa MAN -->
            <div class="red-line animate-line delay-2"></div>

            <!-- Contatti -->
            <div class="contact-info">
                <a href="mailto:massimo.impromart@gmail.com" class="contact-link animate-in delay-3">
                    massimo.impromart@gmail.com
                </a>

                <a href="#" onclick="handlePhoneClick(event)" class="contact-link animate-in delay-4">
                    +39 334 604 4926
                </a>
            </div>
        </div>

        <!-- Dati Aziendali -->
        <div class="company-info animate-in delay-5">
            <div class="company-name">Impromart SRL</div>
            Traversa Fossitelli snc<br>
            80147 - Napoli<br>
            <!-- Carattere invisibile inserito nella P.IVA per bloccare il link blu su iOS -->
            <span class="piva-text">04911&#8203;050633</span>
        </div>
    </div>

    <script>
        // Nasconde l'intro e sblocca la pagina dopo 2.8s
        setTimeout(() => {
            const loader = document.getElementById("loader");
            if (loader) {
                loader.classList.add("hidden");
                setTimeout(() => loader.style.display = 'none', 1000);
            }
        }, 2800);

        // Gestione Salva Contatto + Chiamata
        function handlePhoneClick(e) {
            e.preventDefault();
            
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Ciotola;Massimo;;;
FN:Massimo Ciotola
ORG:Impromart SRL
TITLE:Venditore Camion & Veicoli Industriali
TEL;TYPE=CELL:+393346044926
EMAIL;TYPE=WORK:massimo.impromart@gmail.com
ADR;TYPE=WORK:;;Traversa Fossitelli snc;Napoli;;80147;Italy
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', 'Massimo_Ciotola_MAN.vcf');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                window.location.href = "tel:+393346044926";
            }, 300);
        }
    </script>
</body>
</html>
