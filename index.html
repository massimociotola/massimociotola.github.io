<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Massimo Ciotola - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            /* SFONDO ELEGANTE GRADIENTE */
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
           SCHERMATA INTRO LOGO (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(12px);
            }
            30% {
                opacity: 1;
                filter: blur(0px);
            }
            70% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.05);
                filter: blur(10px);
            }
        }

        /* ----------------------------------------------------
           BIGLIETTO DA VISITA DIGITALE
        ---------------------------------------------------- */
        .card {
            width: 90%;
            max-width: 380px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 85vh;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* NOME E COGNOME */
        .name-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(20px);
            filter: blur(6px);
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 180px;
            height: 4px;
            background-color: #e60000;
            margin: 25px 0 35px 0;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: left;
            box-shadow: 0 0 10px rgba(230, 0, 0, 0.4);
        }

        /* SEZIONE CONTATTI */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            filter: blur(6px);
            transition: color 0.3s, transform 0.2s;
            word-break: break-all;
        }

        .contact-link:active {
            color: #e60000;
            transform: scale(0.98);
        }

        /* SEZIONE AZIENDA FOOTER */
        .company-info {
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.85);
            opacity: 0;
            transform: translateY(20px);
            filter: blur(6px);
            user-select: none;
        }

        .company-name {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #ffffff;
        }

        /* ----------------------------------------------------
           ANIMATIONS LENTE E GRADUALI (1.8 SECONDI)
        ---------------------------------------------------- */
        .animate-in {
            animation: fadeInSlow 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-line {
            animation: expandLineSlow 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSlow {
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes expandLineSlow {
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* Tempi di attesa sincronizzati con la fine dell'intro (2.8s) */
        .delay-1 { animation-delay: 2.8s; } /* Nome */
        .delay-2 { animation-delay: 3.2s; } /* Linea Rossa */
        .delay-3 { animation-delay: 3.6s; } /* Email */
        .delay-4 { animation-delay: 4.0s; } /* Telefono */
        .delay-5 { animation-delay: 4.4s; } /* Azienda */
    </style>
</head>

<body>

    <!-- 1. INTRO LOGO (2.8 SECONDI) -->
    <div id="loader">
        <img src="logo intro.png" alt="Logo" class="intro-logo-img">
    </div>

    <!-- 2. CARD DIGITALE -->
    <div class="card">
        <div>
            <!-- Nome e Cognome -->
            <div class="name-title animate-in delay-1">
                MASSIMO<br>CIOTOLA
            </div>

            <!-- Linea Rossa MAN -->
            <div class="red-line animate-line delay-2"></div>

            <!-- Contatti Cliccabili -->
            <div class="contact-info">
                <!-- Email -->
                <a href="mailto:massimo.impromart@gmail.com" class="contact-link animate-in delay-3">
                    massimo.impromart@gmail.com
                </a>

                <!-- Telefono -->
                <a href="#" onclick="handlePhoneClick(event)" class="contact-link animate-in delay-4">
                    +39 334 604 4926
                </a>
            </div>
        </div>

        <!-- Dati Aziendali -->
        <div class="company-info animate-in delay-5">
            <div class="company-name">Impromart SRL</div>
            Traversa Fossitelli snc<br>
            80147 - Napoli<br>
            04911050633
        </div>
    </div>

    <script>
        // Gestione chiusura pulita dell'intro dopo 2.8s
        setTimeout(() => {
            const loader = document.getElementById("loader");
            if (loader) {
                loader.classList.add("hidden");
                // Rimuove completamente il loader dal DOM dopo la transizione per evitare problemi di sovrapposizione
                setTimeout(() => loader.style.display = 'none', 800);
            }
        }, 2800);

        // Funzione per il salvataggio in rubrica + chiamata
        function handlePhoneClick(e) {
            e.preventDefault();
            
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Ciotola;Massimo;;;
FN:Massimo Ciotola
ORG:Impromart SRL
TITLE:Venditore Camion & Veicoli Industriali
TEL;TYPE=CELL:+393346044926
EMAIL;TYPE=WORK:massimo.impromart@gmail.com
ADR;TYPE=WORK:;;Traversa Fossitelli snc;Napoli;;80147;Italy
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', 'Massimo_Ciotola_MAN.vcf');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                window.location.href = "tel:+393346044926";
            }, 300);
        }
    </script>
</body>
</html>
