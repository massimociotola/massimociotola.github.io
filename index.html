<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Massimo Ciotola - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            /* SFONDO MIGLIORATO: Gradiente dinamico profondo con punto di luce centrale */
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
           SCHERMATA INTRO CON LOGO "logo intro.png" (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: auto;
        }

        #loader.exit {
            pointer-events: none;
            display: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 3s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(12px);
            }
            25% {
                opacity: 1;
                filter: blur(0px);
            }
            75% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.08);
                filter: blur(14px);
            }
        }

        /* ----------------------------------------------------
           BIGLIETTO DA VISITA DIGITALE
        ---------------------------------------------------- */
        .card {
            width: 90%;
            max-width: 380px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 85vh;
            box-sizing: border-box;
            /* MIGLIORAMENTO SFONDO CARD: Effetto scheda elegante e leggero contrasto */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* NOME E COGNOME */
        .name-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(30px);
            filter: blur(10px);
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 180px;
            height: 4px;
            background-color: #e60000;
            margin: 25px 0 35px 0;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: left;
            box-shadow: 0 0 12px rgba(230, 0, 0, 0.5); /* Effetto bagliore sulla linea rossa */
        }

        /* SEZIONE CONTATTI */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: inline-block;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(8px);
            transition: color 0.3s, transform 0.2s;
            word-break: break-all;
        }

        .contact-link:active {
            color: #e60000;
            transform: scale(0.98);
        }

        /* SEZIONE AZIENDA FOOTER */
        .company-info {
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.85);
            opacity: 0;
            transform: translateY(25px);
            filter: blur(8px);
            user-select: none;
        }

        .company-name {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #ffffff;
        }

           ANIMAZIONI MOLTO PIÙ LENTE E MORBIDE (2.2 SECONDI)
        ---------------------------------------------------- */
        .animate-in {
            animation: fadeInUltraSlow 2.2s
