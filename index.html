<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- FORZA BARRE BROWSER NERE E SCURE SU IPHONE E ANDROID -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>Massimo Ciotola - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000;
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
           1. SCHERMATA INTRO LOGO (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% { opacity: 0; transform: scale(0.92); filter: blur(12px); }
            30% { opacity: 1; filter: blur(0px); }
            70% { opacity: 1; filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
        }

        /* ----------------------------------------------------
           2. BIGLIETTO DA VISITA DIGITALE
        ---------------------------------------------------- */
        .card {
            width: 90%;
            max-width: 380px;
            height: 85vh;
            max-height: 700px;
            padding: 35px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center; /* CENTRATURA ORIZZONTALE */
            text-align: center;   /* TESTO CENTRATO */
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInCard 1.2s ease forwards 2.8s;
        }

        @keyframes fadeInCard {
            to { opacity: 1; }
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* NOME E COGNOME */
        .name-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* RUOLO PROFESSIONALE */
        .job-title {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 120px;
            height: 4px;
            background-color: #e60000;
            margin: 20px auto;
            border-radius: 2px;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: center;
            box-shadow: 0 0 12px rgba(230, 0, 0, 0.5);
        }

        /* CONTATTI (PULSANTI/STILE SCHEDA) */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-action:active {
            background: rgba(230, 0, 0, 0.2);
            border-color: #e60000;
            transform: scale(0.98);
        }

        .btn-vcard {
            background: rgba(230, 0, 0, 0.15);
            border: 1px solid rgba(230, 0, 0, 0.4);
            font-weight: 600;
        }

        .btn-icon {
            font-size: 1.1rem;
        }

        /* AZIENDA & PARTITA IVA */
        .company-info {
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.8);
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            user-select: none;
            width: 100%;
        }

        .company-name {
            font-weight: 800;
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .piva-text {
            color: rgba(255, 255, 255, 0.6) !important;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.6) !important;
            text-decoration: none !important;
            font-size: 0.85rem;
            font-weight: 500;
            display: block;
            margin-top: 4px;
        }

        /* ----------------------------------------------------
           ANIMAZIONI LENTE
        ---------------------------------------------------- */
        .animate-in {
            animation: fadeInVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .animate-line {
            animation: expandLineVerySlow 3.2s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        @keyframes fadeInVerySlow {
            0% {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes expandLineVerySlow {
            0% {
                opacity: 0;
                transform: scaleX(0);
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* TEMPI DI APPARIZIONE */
        .delay-1 { animation-delay: 3.8s; } /* Nome */
        .delay-2 { animation-delay: 4.2s; } /* Ruolo */
        .delay-3 { animation-delay: 4.6s; } /* Linea Rossa */
        .delay-4 { animation-delay: 5.0s; } /* Email */
        .delay-5 { animation-delay: 5.4s; } /* Telefono */
        .delay-6 { animation-delay: 5.8s; } /* Salva Contatto */
        .delay-7 { animation-delay: 6.2s; } /* Azienda */
    </style>
</head>

<body>

    <!-- INTRO LOGO -->
    <div id="loader">
        <img src="logo intro.png" alt="Logo" class="intro-logo-img">
    </div>

    <!-- CARD DIGITALE -->
    <div class="card">
        <div class="header-content">
            <!-- Nome e Cognome -->
            <div class="name-title animate-in delay-1">
                MASSIMO<br>CIOTOLA
            </div>

            <!-- Ruolo Professionale -->
            <div class="job-title animate-in delay-2">
                Vendita Veicoli Industriali
            </div>

            <!-- Linea Rossa MAN -->
            <div class="red-line animate-line delay-3"></div>

            <!-- Contatti -->
            <div class="contact-info">
                <a href="mailto:massimo.impromart@gmail.com" class="btn-action animate-in delay-4">
                    <span class="btn-icon">✉️</span> massimo.impromart@gmail.com
                </a>

                <a href="tel:+393346044926" class="btn-action animate-in delay-5">
                    <span class="btn-icon">📞</span> +39 334 604 4926
                </a>

                <button onclick="downloadVCard()" class="btn-action btn-vcard animate-in delay-6">
                    <span class="btn-icon">🎴</span> Salva in Rubrica
                </button>
            </div>
        </div>

        <!-- Dati Aziendali -->
        <div class="company-info animate-in delay-7">
            <div class="company-name">Impromart SRL</div>
            Traversa Fossitelli snc &bull; 80147 Napoli<br>
            <span class="piva-text">P.IVA: 04911&#8203;050633</span>
        </div>
    </div>

    <script>
        // Nasconde l'intro e sblocca la pagina dopo 2.8s
        setTimeout(() => {
            const loader = document.getElementById("loader");
            if (loader) {
                loader.classList.add("hidden");
                setTimeout(() => loader.style.display = 'none', 1000);
            }
        }, 2800);

        // Funzione dedicata solo al salvataggio della vCard
        function downloadVCard() {
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:Ciotola;Massimo;;;
FN:Massimo Ciotola
ORG:Impromart SRL
TITLE:Venditore Veicoli Industriali
TEL;TYPE=CELL:+393346044926
EMAIL;TYPE=WORK:massimo.impromart@gmail.com
ADR;TYPE=WORK:;;Traversa Fossitelli snc;Napoli;;80147;Italy
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', 'Massimo_Ciotola_MAN.vcf');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
