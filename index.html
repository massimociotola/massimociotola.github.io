<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- COLORE DELLE BARRE DEL BROWSER (NERO) -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- IMPEDISCE AD IPHONE DI TRASFORMARE I NUMERI IN LINK BLU -->
    <meta name="format-detection" content="telephone=no">
    
    <title>Massimo Ciotola - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ----------------------------------------------------
           FULLSCREEN & SFONDO
        ---------------------------------------------------- */
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: #000000; /* Fondo base nero per le zone di sicurezza/barre */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Sfondo a gradiente applicato al contenitore prinicipale */
        .page-wrapper {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ----------------------------------------------------
           SCHERMATA INTRO LOGO (2.8 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1.2s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(12px);
            }
            30% {
                opacity: 1;
                filter: blur(0px);
            }
            70% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.05);
                filter: blur(10px);
            }
        }

        /* ----------------------------------------------------
           BIGLIETTO DA VISITA DIGITALE (CARD)
        ---------------------------------------------------- */
        .card {
            width: 90%;
            max-width: 380px;
            height: 85vh;
            height: 85dvh;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInCard 1.5s cubic-bezier(0.1, 1, 0.2, 1) 2.8s forwards;
        }

        @keyframes fadeInCard {
            to {
                opacity: 1;
            }
        }

        /* NOME E COGNOME */
        .name-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 180px;
            height: 4px;
            background-color: #e60000;
            margin: 25px 0 35px 0;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: left;
            box-shadow: 0 0 10px rgba(230, 0, 0, 0.4);
        }

        /* SEZIONE CONTATTI */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: inline-block;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            transition: color 0.3s, transform 0.2s;
            word-break: break-all;
        }

        .contact-link:active {
            color: #e60000;
            transform: scale(0.98);
        }

        /* SEZIONE AZIENDA FOOTER */
        .company-info {
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ffffff;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            user-select: none;
        }

        .company-name {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 4px;
            color: #ffffff;
        }

        /* BLOCCO LINK E COLORI IPHONE SULLA PARTITA IVA */
        .piva-text, 
        .piva-text a {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            text-decoration: none !important;
            pointer-events: none !important;
            font-weight: 500;
            display: block;
            margin-top: 2px;
            user-select: none;
        }

        /* ----------------------------------------------------
           ANIMAZIONI MOLTO PIÙ LENTE (3.5 SECONDI)
        ---------------------------------------------------- */
        .animate-in {
            animation: fadeInVerySlow 3.5s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        .animate-line {
            animation: expandLineVerySlow 3.5s cubic-bezier(0.1, 1, 0.2, 1) forwards;
        }

        @keyframes fadeInVerySlow {
            0% {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes expandLineVerySlow {
            0% {
                opacity: 0;
                transform: scaleX(0);
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
            }
        }
